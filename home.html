<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smriti</title>

    <link rel="stylesheet" href="styles.css">

    
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
            <h1>Smriti</h1>
        </div>
        <div class="header-items">
            <button class="login-button">Login</button>

        </div>

    </header>
    <hr>
    <main class="main-content">
        <section class="introduction">
            <div class="intro-text">
                <h2>Welcome to Smriti</h2>
                <p>Smriti is an AI-powered note-taking application that helps you capture and organize your thoughts effortlessly. With Smriti, you can create, edit, and manage your notes with ease.</p>
        </section>

    </main>

</body>
</html>
